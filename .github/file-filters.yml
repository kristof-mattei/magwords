shared: &shared
  - ".github/**"
  - "assets/**"
  - "build-scripts/**"
docker:
  - *shared
  - ".dockerignore"
  - Dockerfile
rust:
  - *shared
  - "**/*.toml"
  - ".cargo/**"
  - "crates/**"
  - Cargo.lock
typescript:
  - *shared
  - "**/*.ts"
  - ".oxlintrc.json"
  - "front-end/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "tsconfig.json"
